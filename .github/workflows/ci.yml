name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz Godota
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import zasobów
        run: $GODOT --headless --path . --import

      - name: Test dymny (siatka, kolizje, chunki)
        run: $GODOT --headless --path . --script res://tests/smoke.gd

      - name: Test ruchu gracza
        run: $GODOT --headless --path . -- --autotest
